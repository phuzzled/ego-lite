name: CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  SHOULD_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
      - run: npm run style:check
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - run: npm test
      - name: Check plugin style
        working-directory: .
        run: package/ego-browser/node_modules/.bin/prettier --check "plugins/**/*.{mjs,js,json,md}"
      - name: Test agent plugin
        working-directory: plugins/ego
        run: npm test
      - name: Check Linux host style
        working-directory: .
        run: package/ego-browser/node_modules/.bin/prettier --check "package/ego-host-linux/**/*.{mjs,js,json}"
      - name: Test Linux host
        working-directory: package/ego-host-linux
        run: npm test
      - run: npm run validate:site-skills
      - name: Archive release payload
        if: env.SHOULD_RELEASE == 'true'
        run: tar -czf dist/ego-browser-release-payload.tar.gz -C dist/out .
      - uses: actions/upload-artifact@v4
        if: env.SHOULD_RELEASE == 'true'
        with:
          name: ego-browser-release-payload
          path: package/ego-browser/dist/ego-browser-release-payload.tar.gz

  # The Linux host against a real browser: unit tests, then the SDK's
  # real-browser E2E suite through the host CLI, headless and headed on Xvfb.
  linux-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EGO_BROWSER_REAL_E2E_CLI: ${{ github.workspace }}/package/ego-host-linux/bin/ego-browser.mjs
      XDG_RUNTIME_DIR: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - name: Test Linux host
        working-directory: package/ego-host-linux
        run: npm test
      - name: Install SDK dependencies
        working-directory: package/ego-browser
        run: npm ci
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow the Chrome sandbox
        # Ubuntu 24.04 blocks unprivileged user namespaces for binaries
        # without an AppArmor profile, which includes Chrome for Testing.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: E2E, headless
        working-directory: package/ego-browser
        env:
          EGO_LITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          export HOME="$RUNNER_TEMP/home-headless"
          mkdir -p "$HOME"
          # Real-browser runs can flake; retry once with a fresh daemon.
          node scripts/run-real-browser-e2e.mjs || {
            node "$EGO_BROWSER_REAL_E2E_CLI" stop
            node scripts/run-real-browser-e2e.mjs
          }
          node "$EGO_BROWSER_REAL_E2E_CLI" stop
      - name: E2E, headed on Xvfb
        working-directory: package/ego-browser
        env:
          EGO_LITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          EGO_LITE_HEADLESS: "0"
          EGO_LITE_PASSWORD_STORE: basic
        run: |
          export HOME="$RUNNER_TEMP/home-headed"
          mkdir -p "$HOME"
          xvfb-run -a sh -c 'node scripts/run-real-browser-e2e.mjs || {
            node "$EGO_BROWSER_REAL_E2E_CLI" stop
            node scripts/run-real-browser-e2e.mjs
          }; status=$?; node "$EGO_BROWSER_REAL_E2E_CLI" stop; exit $status'
      - name: Upload daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-host-logs
          path: |
            ${{ runner.temp }}/home-*/.local/state/ego-lite/daemon.log
            ${{ runner.temp }}/home-*/.local/state/ego-lite/events.jsonl
            ${{ runner.temp }}/home-*/.local/state/ego-lite/rounds/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ego-browser-release-payload
          path: package/ego-browser/dist
      - name: Extract release payload
        run: |
          mkdir -p dist/out
          tar -xzf dist/ego-browser-release-payload.tar.gz -C dist/out
      - name: Resolve release channel
        id: release
        run: |
          ref_name="${GITHUB_REF_NAME}"
          supported="true"
          previous_tag=""

          if [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            prerelease="true"
            latest="false"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*-beta.*' | grep -v "^$release_tag$" | head -1 || true)"
          elif [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            prerelease="false"
            latest="true"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$release_tag$" | head -1 || true)"
          else
            echo "Unsupported release ref: $ref_name"
            supported="false"
          fi

          {
            echo "supported=$supported"
            echo "release_tag=$release_tag"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Package release payload
        if: steps.release.outputs.supported == 'true'
        run: |
          release_tag="${{ steps.release.outputs.release_tag }}"
          cd dist/out
          zip -r "../ego-browser-${release_tag}.zip" .
      - name: Create release
        if: steps.release.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"

          release_tag="${{ steps.release.outputs.release_tag }}"
          prerelease="${{ steps.release.outputs.prerelease }}"
          latest="${{ steps.release.outputs.latest }}"
          previous_tag="${{ steps.release.outputs.previous_tag }}"
          commit_sha="$(git rev-parse HEAD)"
          artifact="package/ego-browser/dist/ego-browser-${release_tag}.zip"
          notes_file="$(mktemp)"
          release_args=()
          notes_args=()

          if [ "$prerelease" = "false" ] && ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "Stable release tags must point to commits reachable from main."
            exit 1
          fi

          if [ "$prerelease" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if [[ "$release_tag" == v*.*.*-beta.* ]]; then
            release_args+=(--draft)
          fi

          if [ "$latest" = "true" ]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi

          if [ -n "$previous_tag" ]; then
            notes_args+=(-f "previous_tag_name=$previous_tag")
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$commit_sha" \
            "${notes_args[@]}" \
            --jq .body > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$release_tag" \
              --notes-file "$notes_file" \
              "${release_args[@]}"
            gh release upload "$release_tag" "$artifact" --clobber
          else
            gh release create "$release_tag" \
              --title "$release_tag" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${release_args[@]}" \
              "$artifact"
          fi
